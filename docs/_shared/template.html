<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Juristic Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Document design tokens (NOT the product UI; product UI lives under .screen) ---------- */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --border:#e2e5ea; --border-strong:#c9ced6;
  --text:#1b2129; --text-2:#3f4753; --muted:#6b7280; --link:#0b5fd7;
  --accent:#0b5fd7; --accent-soft:#e7efff;
  --ok:#137a3a; --ok-soft:#e3f5e9; --warn:#9a5b00; --warn-soft:#fff3dc; --bad:#b42318; --bad-soft:#fdecea; --info:#0b6b8f; --info-soft:#e2f3fa;
  --water:#0b7fab; --water-soft:#e0f2fa; --elec:#c27400; --elec-soft:#fff1d6; --fee:#6b4fbb; --fee-soft:#ece7fa;
  --draft:#6b7280; --unpaid:#c27400; --paid:#137a3a; --overdue:#b42318;
  --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:"Inter","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --toc-w:260px; --content-w:1080px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --surface:#161b22; --surface-2:#1e252e; --border:#2a323d; --border-strong:#3b4552;
    --text:#e6e9ee; --text-2:#c3c9d2; --muted:#8b94a1; --link:#6ea3ff;
    --accent:#6ea3ff; --accent-soft:#17263f;
    --ok:#4fd07f; --ok-soft:#10301c; --warn:#f2b447; --warn-soft:#332507; --bad:#ff7b6b; --bad-soft:#3a1512; --info:#5cc3ea; --info-soft:#0e2a35;
    --water:#4fb8e0; --water-soft:#0e2a35; --elec:#f0a93a; --elec-soft:#332507; --fee:#a992ee; --fee-soft:#231c3d;
    --draft:#8b94a1; --unpaid:#f0a93a; --paid:#4fd07f; --overdue:#ff7b6b;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#161b22; --surface-2:#1e252e; --border:#2a323d; --border-strong:#3b4552;
  --text:#e6e9ee; --text-2:#c3c9d2; --muted:#8b94a1; --link:#6ea3ff;
  --accent:#6ea3ff; --accent-soft:#17263f;
  --ok:#4fd07f; --ok-soft:#10301c; --warn:#f2b447; --warn-soft:#332507; --bad:#ff7b6b; --bad-soft:#3a1512; --info:#5cc3ea; --info-soft:#0e2a35;
  --water:#4fb8e0; --water-soft:#0e2a35; --elec:#f0a93a; --elec-soft:#332507; --fee:#a992ee; --fee-soft:#231c3d;
  --draft:#8b94a1; --unpaid:#f0a93a; --paid:#4fd07f; --overdue:#ff7b6b;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;font-weight:600;color:var(--text);margin:0}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:22px;margin-top:56px;padding-top:16px;border-top:1px solid var(--border)}
h2:first-child{margin-top:0;border-top:0;padding-top:0}
h3{font-size:17px;margin-top:32px}
h4{font-size:15px;margin-top:20px;color:var(--text-2)}
p{margin:10px 0}
ul,ol{padding-left:22px;margin:8px 0}
li{margin:3px 0}
hr{border:0;border-top:1px solid var(--border);margin:32px 0}
small,.muted{color:var(--muted)}
strong{font-weight:600}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
pre{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5}
pre code{background:none;border:0;padding:0;font-size:inherit}
blockquote{margin:12px 0;padding:8px 16px;border-left:3px solid var(--border-strong);color:var(--text-2)}
img,svg{max-width:100%}
details{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;margin:10px 0;background:var(--surface)}
summary{cursor:pointer;font-weight:500}

/* ---------- Layout ---------- */
.doc-header{background:var(--surface);border-bottom:1px solid var(--border);padding:22px 32px}
.doc-header .crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.doc-header .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-top:8px}
.doc-header .meta b{color:var(--text-2);font-weight:500}
.layout{display:grid;grid-template-columns:var(--toc-w) minmax(0,1fr);gap:0;max-width:calc(var(--toc-w) + var(--content-w) + 64px);margin:0 auto}
.toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:24px 16px 40px 24px;font-size:13px;border-right:1px solid var(--border)}
.toc .toc-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.toc ul{list-style:none;padding:0;margin:0}
.toc ul ul{padding-left:12px}
.toc li{margin:0}
.toc a{display:block;padding:4px 8px;border-radius:4px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc a:hover{background:var(--surface-2);text-decoration:none}
.toc a.active{color:var(--accent);background:var(--accent-soft)}
.content{padding:32px 32px 96px;min-width:0}
@media (max-width:960px){.layout{grid-template-columns:1fr}.toc{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--border)}.content{padding:24px 16px 64px}.doc-header{padding:18px 16px}}

/* ---------- Components ---------- */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;text-align:left}
th{background:var(--surface-2);font-weight:600;font-size:13px;color:var(--text-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;margin:14px 0}
.table-wrap table{margin:0}
.callout{border:1px solid var(--border);border-left:4px solid var(--accent);background:var(--surface);border-radius:var(--radius-sm);padding:12px 16px;margin:16px 0}
.callout .title{font-weight:600;margin-bottom:4px;font-size:14px}
.callout.note{border-left-color:var(--info);background:var(--info-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.decision{border-left-color:var(--fee);background:var(--fee-soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;border:1px solid transparent;white-space:nowrap}
.badge.draft{background:var(--surface-2);color:var(--draft);border-color:var(--border-strong)}
.badge.unpaid{background:var(--elec-soft);color:var(--unpaid)}
.badge.paid{background:var(--ok-soft);color:var(--paid)}
.badge.overdue{background:var(--bad-soft);color:var(--overdue)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.neutral{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.badge.water{background:var(--water-soft);color:var(--water)}
.badge.elec{background:var(--elec-soft);color:var(--elec)}
.badge.fee{background:var(--fee-soft);color:var(--fee)}
.badge.p0{background:var(--bad-soft);color:var(--bad)} .badge.p1{background:var(--warn-soft);color:var(--warn)} .badge.p2{background:var(--surface-2);color:var(--text-2)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:16px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card h3,.card h4{margin-top:0}
.diagram{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:16px 0;overflow-x:auto}
.diagram .caption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
pre.mermaid{background:transparent;border:0;padding:0;text-align:center;font-family:var(--font);font-size:14px}
.tree{font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre}
.tree .c{color:var(--muted)}
.steps{counter-reset:step;list-style:none;padding:0;margin:14px 0}
.steps li{position:relative;padding-left:40px;margin:10px 0}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.formula{font-family:var(--mono);background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 14px;margin:10px 0;font-size:14px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.checklist{list-style:none;padding-left:0}
.checklist li{padding-left:26px;position:relative}
.checklist li::before{content:"";position:absolute;left:2px;top:7px;width:14px;height:14px;border:1.5px solid var(--border-strong);border-radius:3px}

/* ---------- Device frames for UI mockups (mockup content itself is styled by tokens.css under .screen) ---------- */
.device{margin:20px auto;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 30px rgba(16,24,40,.12);overflow:hidden}
.device.phone{width:390px;max-width:100%;border-radius:36px;border:8px solid #1b1f24;background:#1b1f24}
.device.phone .screen{border-radius:28px;min-height:760px;background:#fff;overflow:hidden}
.device.desktop{width:100%;max-width:1200px;border-radius:10px}
.device.desktop .chrome{height:34px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 12px}
.device.desktop .chrome i{width:11px;height:11px;border-radius:50%;background:#d1d5db;display:inline-block}
.device.desktop .chrome i:nth-child(1){background:#ff5f57}.device.desktop .chrome i:nth-child(2){background:#febc2e}.device.desktop .chrome i:nth-child(3){background:#28c840}
.device.desktop .chrome .url{margin-left:10px;flex:1;height:20px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:11px;color:var(--muted);padding:0 8px;line-height:20px;font-family:var(--mono)}
.device.desktop .screen{min-height:720px;background:#fff;overflow:hidden}
.device.print{width:100%;max-width:420px;border-radius:4px;background:#fff}
.device.print .screen{background:#fff;padding:0}
.screen{color:#1b2129;font-family:"Noto Sans Thai","Inter",sans-serif;font-size:14px;line-height:1.45;text-align:left}
.annotations{counter-reset:ann;margin:12px 0 28px}
.annotations li{margin:6px 0}
.ann{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:middle;font-family:var(--font)}
.screen .ann{position:absolute;box-shadow:0 0 0 2px #fff}
.screen-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:6px 0 10px}
.screen-meta b{color:var(--text-2);font-weight:500}

/* ---------- Print ---------- */
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .toc{display:none}
  .layout{display:block;max-width:none}
  .content{padding:0}
  .doc-header{padding:0 0 12px;border-bottom:1px solid #000}
  h2{break-before:page}
  h2:first-child{break-before:auto}
  .device,.card,.callout,.diagram{break-inside:avoid;box-shadow:none}
  a{color:#000}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
<header class="doc-header">
  <div class="crumbs">Juristic Platform · Documentation</div>
  <h1>{{TITLE}}</h1>
  <div class="meta"><span><b>Owner:</b> {{ROLE}}</span><span><b>Date:</b> {{DATE}}</span><span><b>Status:</b> {{STATUS}}</span><span><b>Version:</b> 1.0</span></div>
</header>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Table of contents"><div class="toc-title">Contents</div></nav>
  <main class="content" id="content">
{{BODY}}
  </main>
</div>
<script>
(function(){
  // Build TOC from h2/h3 in #content
  var content=document.getElementById('content'), toc=document.getElementById('toc');
  var heads=content.querySelectorAll('h2, h3'), root=document.createElement('ul'), cur=null, used={};
  heads.forEach(function(h){
    if(!h.id){var s=h.textContent.trim().toLowerCase().replace(/[^\w฀-๿]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'sec';var b=s,i=2;while(used[s]||document.getElementById(s)){s=b+'-'+(i++)}h.id=s}
    used[h.id]=1;
    var li=document.createElement('li'),a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;li.appendChild(a);
    if(h.tagName==='H2'){root.appendChild(li);cur=li}
    else{if(!cur){root.appendChild(li);return}var ul=cur.querySelector(':scope > ul');if(!ul){ul=document.createElement('ul');cur.appendChild(ul)}ul.appendChild(li)}
  });
  toc.appendChild(root);
  var links=toc.querySelectorAll('a');
  if('IntersectionObserver' in window){
    var map={};links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a});
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.remove('active')});var a=map[e.target.id];if(a)a.classList.add('active')}})},{rootMargin:'0px 0px -75% 0px'});
    heads.forEach(function(h){io.observe(h)});
  }
  // Mermaid
  var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(window.mermaid){mermaid.initialize({startOnLoad:true,theme:dark?'dark':'neutral',securityLevel:'loose',flowchart:{curve:'basis',htmlLabels:true},er:{useMaxWidth:true},sequence:{useMaxWidth:true},gantt:{useMaxWidth:true}})}
})();
</script>
</body>
</html>
